<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="greenRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ecoMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#ecoPaper)"/>
  <rect x="25" y="25" width="750" height="510" rx="8" fill="none" stroke="#059669" stroke-width="4"/>
  <rect x="33" y="33" width="734" height="494" rx="4" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Left Registrar Logo -->
  <g transform="translate(90, 75)">
    <circle cx="0" cy="0" r="28" fill="#065f46"/>
    <text x="0" y="4" font-family="sans-serif" font-size="12" font-weight="black" fill="#ffffff" text-anchor="middle">DNV</text>
    <text x="0" y="15" font-family="sans-serif" font-size="7" fill="#6ee7b7" text-anchor="middle">CERTIFIED</text>
    <text x="0" y="40" font-family="sans-serif" font-size="8" font-weight="bold" fill="#065f46" text-anchor="middle">ENVIRONMENT</text>
  </g>

  <!-- Title -->
  <g transform="translate(400, 85)" text-anchor="middle">
    <text y="0" font-family="sans-serif" font-size="28" font-weight="900" fill="#065f46" letter-spacing="2">
      ENVIRONMENTAL MANAGEMENT SYSTEM
    </text>
    <text y="22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#334155">
      گواهینامه بین‌المللی مدیریت زیست‌محیطی و کاهش پسماند
    </text>
    <line x1="-150" y1="32" x2="150" y2="32" stroke="#10b981" stroke-width="2"/>
  </g>

  <!-- Big Badge -->
  <g transform="translate(400, 165)" text-anchor="middle">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="url(#greenRibbon)"/>
    <text y="7" font-family="sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1">
      ISO 14001 : 2015
    </text>
  </g>

  <!-- Company -->
  <g transform="translate(400, 230)" text-anchor="middle">
    <text y="0" font-family="sans-serif" font-size="11" fill="#64748b" letter-spacing="1">
      ACCREDITED INDUSTRIAL FACILITY
    </text>
    <text y="26" font-family="Vazirmatn, Tahoma, sans-serif" font-size="22" font-weight="900" fill="#065f46">
      صنایع تام فولاد (سهامی خاص)
    </text>
    <text y="46" font-family="sans-serif" font-size="12" font-weight="bold" fill="#059669">
      TAM STEEL INDUSTRIAL CO. (P.J.S)
    </text>
  </g>

  <!-- Scope -->
  <g transform="translate(400, 310)" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif">
    <text y="0" font-size="12" fill="#334155">
      مدیریت پسماندهای برشی، بازیافت بهینه ضایعات نواربری، مدیریت روغن‌های صنعتی ضدزنگ
    </text>
    <text y="20" font-size="12" fill="#334155">
      و بهینه‌سازی مصرف انرژی در خطوط برش و توزیع مقاطع فولادی
    </text>
    <text y="42" font-family="sans-serif" font-size="10" fill="#64748b">
      Scrap recycling, eco-friendly coolant management, and industrial carbon footprint reduction.
    </text>
  </g>

  <!-- Meta Info -->
  <g transform="translate(90, 390)" font-family="sans-serif" font-size="11">
    <rect x="0" y="0" width="185" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="92" y="20" fill="#64748b" text-anchor="middle" font-size="9">CERTIFICATE NO.</text>
    <text x="92" y="38" fill="#065f46" text-anchor="middle" font-weight="bold" font-family="monospace">EMS-14001-IR419</text>

    <rect x="215" y="0" width="185" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="307" y="20" fill="#64748b" text-anchor="middle" font-size="9">INITIAL ISSUE DATE</text>
    <text x="307" y="38" fill="#0f172a" text-anchor="middle" font-weight="bold">2021-04-10</text>

    <rect x="430" y="0" width="185" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="522" y="20" fill="#64748b" text-anchor="middle" font-size="9">VALID UNTIL</text>
    <text x="522" y="38" fill="#16a34a" text-anchor="middle" font-weight="bold">2027-04-09</text>
  </g>

  <!-- Eco Seal -->
  <g transform="translate(700, 465)">
    <circle cx="0" cy="0" r="34" fill="url(#ecoMedal)" stroke="#064e3b" stroke-width="2"/>
    <text x="0" y="-8" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">GREEN ECO</text>
    <text x="0" y="5" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">ISO 14001</text>
    <text x="0" y="16" font-family="sans-serif" font-size="7" fill="#6ee7b7" text-anchor="middle">VERIFIED</text>
  </g>

  <g transform="translate(300, 475)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#94a3b8" stroke-width="1"/>
    <text x="0" y="14" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Environmental Auditor Registry</text>
  </g>
</svg>
