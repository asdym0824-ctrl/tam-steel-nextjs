<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="120" height="130">
  <defs>
    <linearGradient id="ecunionGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Shield Card -->
  <rect x="5" y="5" width="110" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow2)"/>

  <!-- Top Badge Ribbon / Emblem -->
  <path d="M48,15 L72,15 L68,26 L60,23 L52,26 Z" fill="url(#goldAccent)"/>

  <!-- Central Crest: Shield & Digital Network Symbol -->
  <g transform="translate(60, 56)">
    <!-- Outer Shield -->
    <path d="M0,-24 C16,-24 24,-18 24,-6 C24,12 12,22 0,26 C-12,22 -24,12 -24,-6 C-24,-18 -16,-24 0,-24 Z" fill="url(#ecunionGreen)"/>
    <path d="M0,-21 C14,-21 21,-16 21,-6 C21,10 10,19 0,23 C-10,19 -21,10 -21,-6 C-21,-16 -14,-21 0,-21 Z" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.6"/>

    <!-- Shopping / Digital Cart & Network Nodes -->
    <path d="M-10,-8 L-8,-8 L-4,7 L7,7 L10,-3 L-5,-3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-3" cy="11" r="2" fill="#ffffff"/>
    <circle cx="5" cy="11" r="2" fill="#ffffff"/>

    <!-- Checkmark / Trust Tick -->
    <path d="M-2,-1 L1,2 L6,-4" fill="none" stroke="url(#goldAccent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Official Persian Text -->
  <text x="60" y="96" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5" font-weight="bold" fill="#1e293b" text-anchor="middle">
    کسب و کار اینترنتی
  </text>
  <text x="60" y="110" font-family="Vazirmatn, Tahoma, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">
    اتحادیه کشوری کسب‌وکارهای مجازی
  </text>
</svg>
